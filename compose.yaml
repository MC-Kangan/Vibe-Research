name: vibe-research

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      VR_DATA_DIR: /data
      VR_REPORTS_DIR: /data/myreports
      VR_ALLOW_ORIGINS: ${VR_PUBLIC_ORIGIN:-http://127.0.0.1:8080}
      VR_API_KEY: ${VR_API_KEY:-}
      VR_AUTH_ENABLED: ${VR_AUTH_ENABLED:-false}
      VR_AUTH_DB_PATH: ${VR_AUTH_DB_PATH:-/data/auth.sqlite3}
      VR_AUTH_USERNAME: ${VR_AUTH_USERNAME:-}
      VR_AUTH_PASSWORD_HASH: ${VR_AUTH_PASSWORD_HASH:-}
      VR_SESSION_TTL_HOURS: ${VR_SESSION_TTL_HOURS:-12}
      VR_AUTH_COOKIE_SECURE: ${VR_AUTH_COOKIE_SECURE:-false}
      VR_FINNHUB_API_KEY: ${VR_FINNHUB_API_KEY:-}
      VR_SEC_USER_AGENT: ${VR_SEC_USER_AGENT:-}
      VR_COINGECKO_API_KEY: ${VR_COINGECKO_API_KEY:-}
      VR_COINGECKO_API_TIER: ${VR_COINGECKO_API_TIER:-demo}
      VR_COINBASE_API_KEY_NAME: ${VR_COINBASE_API_KEY_NAME:-}
      VR_COINBASE_API_PRIVATE_KEY: ${VR_COINBASE_API_PRIVATE_KEY:-}
      VR_COINBASE_API_ALGORITHM: ${VR_COINBASE_API_ALGORITHM:-ES256}
      VR_TRADE_RESEARCH_ENABLED: ${VR_TRADE_RESEARCH_ENABLED:-false}
      VR_TRADE_RESEARCH_BASE_URL: ${VR_TRADE_RESEARCH_BASE_URL:-http://research-api:8000}
      VR_TRADE_RESEARCH_API_TOKEN: ${VR_TRADE_RESEARCH_API_TOKEN:-}
      VR_TRADE_RESEARCH_TIMEOUT_SECONDS: ${VR_TRADE_RESEARCH_TIMEOUT_SECONDS:-30}
      VR_IBKR_FLEX_TOKEN: ${VR_IBKR_FLEX_TOKEN:-}
      VR_IBKR_FLEX_QUERY_ID: ${VR_IBKR_FLEX_QUERY_ID:-}
      VR_IBKR_FLEX_HISTORY_QUERY_ID: ${VR_IBKR_FLEX_HISTORY_QUERY_ID:-}
      VR_IBKR_FLEX_BASE_URL: ${VR_IBKR_FLEX_BASE_URL:-https://ndcdyn.interactivebrokers.com/AccountManagement/FlexWebService}
      VR_IBKR_FLEX_TIMEZONE: ${VR_IBKR_FLEX_TIMEZONE:-Europe/London}
      VR_IBKR_FLEX_COOLDOWN_SECONDS: ${VR_IBKR_FLEX_COOLDOWN_SECONDS:-300}
      VR_IBKR_FLEX_TIMEOUT_SECONDS: ${VR_IBKR_FLEX_TIMEOUT_SECONDS:-20}
      VR_IBKR_FLEX_REQUEST_RETRIES: ${VR_IBKR_FLEX_REQUEST_RETRIES:-1}
      VR_IBKR_FLEX_RETRIES: ${VR_IBKR_FLEX_RETRIES:-3}
      VR_IBKR_FLEX_RETRY_DELAY_SECONDS: ${VR_IBKR_FLEX_RETRY_DELAY_SECONDS:-5}
      VR_IBKR_FLEX_INTER_QUERY_DELAY_SECONDS: ${VR_IBKR_FLEX_INTER_QUERY_DELAY_SECONDS:-5}
      VR_IBKR_POSITION_STORE: ${VR_IBKR_POSITION_STORE:-/data/ibkr-positions.json}
      VR_IBKR_ANALYTICS_STORE: ${VR_IBKR_ANALYTICS_STORE:-/data/ibkr-analytics.sqlite3}
    volumes:
      - ${VR_DATA_PATH:-vibe-data}:/data
    expose:
      - "8900"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8900/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 2g

  research-api:
    profiles: ["research"]
    image: ${TRADE_RESEARCH_IMAGE:-trade-research:latest}
    restart: unless-stopped
    init: true
    command: ["trade-research", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TRADE_RESEARCH_API_TOKEN: ${VR_TRADE_RESEARCH_API_TOKEN:-}
      TRADE_RESEARCH_PRICE_PROVIDER: ${TRADE_RESEARCH_PRICE_PROVIDER:-yahoo}
      TRADE_RESEARCH_FUNDAMENTAL_PROVIDER: ${TRADE_RESEARCH_FUNDAMENTAL_PROVIDER:-}
      TRADE_RESEARCH_SEC_USER_AGENT: ${VR_SEC_USER_AGENT:-}
      TRADE_RESEARCH_DATA_ROOT: /var/lib/trade-research
      TRADE_RESEARCH_DATA_DIR: /var/lib/trade-research
    volumes:
      - trade-research-data:/var/lib/trade-research
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=5).close()"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 5

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${VR_BIND_ADDRESS:-127.0.0.1}:${VR_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    mem_limit: 256m

volumes:
  vibe-data:
  trade-research-data:
